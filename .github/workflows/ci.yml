name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: run on sample (expect scanning + probing, exit 2)
        run: |
          set +e
          out=$(lua5.4 nginxwatch.lua sample.log); code=$?
          echo "$out"; echo "exit=$code"
          echo "$out" | grep -q '"tool":"nginxwatch"' || exit 1
          echo "$out" | grep -q '"type":"scanning"' || { echo "missing scanning"; exit 1; }
          echo "$out" | grep -q '"type":"probing"'  || { echo "missing probing"; exit 1; }
          [ "$code" = "2" ] || { echo "expected exit 2"; exit 1; }
